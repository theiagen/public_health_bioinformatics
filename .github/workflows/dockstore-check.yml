#
# This workflow runs on Pushes and Pull Requests against the main branch. It
# verifies that every release workflow is registered in Dockstore -- that is,
# every workflows/**/*.wdl outside workflows/utilities/ has a matching
# primaryDescriptorPath entry in .dockstore.yml.
#
# Workflows under workflows/utilities/ are subworkflows: imported by other
# workflows, never registered on their own.
#
name: Dockstore Registration Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check Dockstore registration
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v6

      # Install a version of Python3
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # PyYAML is used to parse .dockstore.yml
      - name: Install dependencies
        run: pip3 -q install pyyaml

      # Fails if a workflow is unregistered, if a registered path no longer
      # resolves, or if a subworkflow has been registered by mistake
      - name: Check Dockstore registration
        run: python3 .github/scripts/check_dockstore_registration.py
