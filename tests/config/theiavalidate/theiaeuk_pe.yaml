# TheiaValidate v2 preset: theiaeuk_pe
# Auto-generated from validation-criteria-v4-2-0-theiaeuk-illumina-pe.tsv
#
# KEYLESS preset: the Terra entity-id column (entity:<table>_id) differs per
# export, so pass the key at run time, e.g.:
#   theiavalidate validate T1 T2 --preset theiaeuk_pe \
#     --key1 entity:<table1>_id --key2 entity:<table2>_id
# (or --key <col> when both tables share one key column).

columns:
  assembly_length:
    type: float
    any_of:
      - method: percent_diff
        threshold: 0.01
      - method: range
        threshold: 500
  busco_results:
    type: float
    parse:
      method: regex
      pattern: 'C:(?P<complete>[\d.]+)%'
      field: complete
    method: range
    threshold: 2
    # v1: SET,2 over the packed BUSCO string; here = completeness range
  clade_type:
    method: exact
  combined_mean_q_clean:
    method: percent_diff
    threshold: 0.01
    type: float
  combined_mean_readlength_clean:
    method: percent_diff
    threshold: 0.01
    type: float
  est_coverage_clean:
    method: percent_diff
    threshold: 0.01
    type: float
  fastq_scan_num_reads_clean1:
    method: percent_diff
    threshold: 0.01
    type: float
  fastq_scan_num_reads_clean2:
    method: percent_diff
    threshold: 0.01
    type: float
  fastqc_num_reads_clean1:
    method: percent_diff
    threshold: 0.01
    type: float
  fastqc_num_reads_clean2:
    method: percent_diff
    threshold: 0.01
    type: float
  gambit_predicted_taxon:
    method: exact
  number_contigs:
    type: float
    any_of:
      - method: percent_diff
        threshold: 0.01
      - method: range
        threshold: 2
  quast_gc_percent:
    method: percent_diff
    threshold: 0.01
    type: float
  variant_annotations:
    method: exact
    type: set[str]
    delimiter: ","
