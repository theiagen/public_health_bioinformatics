# TheiaValidate v2 preset: theiameta_pe
# Auto-generated from validation-criteria-v4-2-0-theiameta-illumina-pe.tsv
#
# KEYLESS preset: the Terra entity-id column (entity:<table>_id) differs per
# export, so pass the key at run time, e.g.:
#   theiavalidate validate T1 T2 --preset theiameta_pe \
#     --key1 entity:<table1>_id --key2 entity:<table2>_id
# (or --key <col> when both tables share one key column).

