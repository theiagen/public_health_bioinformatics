# 
# This workflow will run on Pushes and Pull Requests against the main branch. It
# will only run "miniwdl check" on wdl files that have had a change in the push 
# or PR.
#
name: MiniWDL Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      # Expose workflows with changes
      workflows: ${{ steps.filter.outputs.wf }}
      workflows_files: ${{ steps.filter.outputs.wf_files }}
    steps:
      # Checkout the repo
      - uses: actions/checkout@v6

      # Select wdl files with changes
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            wf:  
              - added|modified: 'tasks/**'
              - added|modified: 'workflows/**'
          list-files: json

  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.wf }}
    needs: changes
    if: ${{ needs.changes.outputs.workflows != '' && toJson(fromJson(needs.changes.outputs.workflows)) != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        wf: ${{ fromJson(needs.changes.outputs.workflows_files) }}
    steps:
      # Checkout the repo
      - uses: actions/checkout@v6

      # Install a version of Python3
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      
      # Install MiniWDL (WDL syntax) and ShellCheck (shell syntax)
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install shellcheck
          pip3 -q install miniwdl 'importlib-metadata==4.13.0'

      # Run MiniWDL check on each of the changed WDLs
      - name: MiniWDL Check ${{ matrix.wf }}
        run: miniwdl check ${{ matrix.wf }}

  # PHB WDL style + registry checks, via the `wdl` hook group in
  # .config/.pre-commit-config.yaml — the same hooks contributors get locally
  # from `prek install`. Separate from the matrix above, which stays as the
  # per-file miniwdl check (prek also runs miniwdl, so that one check is
  # duplicated; the matrix gives nicer per-file job names, so it is kept).
  lint:
    runs-on: ubuntu-latest
    name: prek (wdl group)
    env:
      PREK_VERSION: "0.5.2"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # shellcheck is not optional: miniwdl SILENTLY SKIPS linting of command
      # blocks when it is missing, so without it this job checks less than it
      # appears to. Keep the miniwdl version in step with the matrix job above.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install shellcheck
          pip3 -q install miniwdl 'importlib-metadata==4.13.0' "prek==${PREK_VERSION}"

      # --all-files, not a PR diff: tasks/ and workflows/ are clean repo-wide,
      # so there is no pre-existing debt to trip a contributor on, and running
      # everything means a push straight to main cannot bypass these checks.
      #
      # Caveat: this includes wdl-docker-exists, the one hook that depends on
      # external state — if an upstream image is deleted, every PR goes red
      # until it is replaced. If that becomes a nuisance, add
      # `--no-group docker-registry` here and run it on a schedule instead.
      - name: Run WDL hooks
        run: |
          prek run --all-files --show-diff-on-failure \
            -c .config/.pre-commit-config.yaml --group wdl
