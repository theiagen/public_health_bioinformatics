name: lint-documentation

# Lints documentation on pull requests that touch docs or the lint config.
on:
  pull_request:
    paths:
      - "docs/**"
      - ".config/**"
      - ".github/workflows/lint-documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.9.1"
      PREK_VERSION: "0.5.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vale
        run: |
          curl -sfL \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version

      # prek is a drop-in reimplementation of pre-commit; it reads the same
      # config but can select one hook group, which is what keeps the WDL hooks
      # in .config/.pre-commit-config.yaml from running in this docs-only job.
      - name: Install prek
        run: pip install "prek==${{ env.PREK_VERSION }}"

      # Runs every `docs` hook (whitespace, markdownlint, vale) against all
      # files. The whitespace auto-fixers fail the job if they would change
      # anything, printing the diff so contributors can see exactly what to fix.
      - name: Run linters
        run: |
          prek run --all-files --show-diff-on-failure \
            -c .config/.pre-commit-config.yaml --group docs
