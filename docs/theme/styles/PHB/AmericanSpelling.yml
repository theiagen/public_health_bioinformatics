extends: substitution
message: "Use American spelling: '%s' instead of '%s'."
level: warning
# ignorecase lets us catch sentence-initial capitals (e.g. "Characterisation").
# The suggested replacement is lowercase; adjust the casing when you apply it.
ignorecase: true
action:
  name: replace
swap:
  # -ise / -isation -> -ize / -ization
  'characterise': 'characterize'
  'characterised': 'characterized'
  'characterising': 'characterizing'
  'characterisation': 'characterization'
  'visualise': 'visualize'
  'visualised': 'visualized'
  'visualising': 'visualizing'
  'visualisation': 'visualization'
  'organise': 'organize'
  'organised': 'organized'
  'organising': 'organizing'
  'organisation': 'organization'
  'categorise': 'categorize'
  'categorised': 'categorized'
  'categorising': 'categorizing'
  'categorisation': 'categorization'
  'normalise': 'normalize'
  'normalised': 'normalized'
  'normalising': 'normalizing'
  'normalisation': 'normalization'
  'summarise': 'summarize'
  'summarised': 'summarized'
  'summarising': 'summarizing'
  'optimise': 'optimize'
  'optimised': 'optimized'
  'optimising': 'optimizing'
  'optimisation': 'optimization'
  'utilise': 'utilize'
  'utilised': 'utilized'
  'utilising': 'utilizing'
  'prioritise': 'prioritize'
  'prioritised': 'prioritized'
  'recognise': 'recognize'
  'recognised': 'recognized'
  'minimise': 'minimize'
  'minimised': 'minimized'
  'maximise': 'maximize'
  'maximised': 'maximized'
  # -yse -> -yze  (note: "analyses" is intentionally omitted — it is also the
  # plural noun of "analysis")
  'analyse': 'analyze'
  'analysed': 'analyzed'
  'analysing': 'analyzing'
  'catalyse': 'catalyze'
  # -our -> -or
  'colour': 'color'
  'colours': 'colors'
  'coloured': 'colored'
  'behaviour': 'behavior'
  'behaviours': 'behaviors'
  'neighbour': 'neighbor'
  'neighbours': 'neighbors'
  'neighbouring': 'neighboring'
  'favour': 'favor'
  'labour': 'labor'
  # -re -> -er
  'centre': 'center'
  'centres': 'centers'
  'fibre': 'fiber'
  'metre': 'meter'
  'litre': 'liter'
  # -ogue -> -og
  'catalogue': 'catalog'
  'catalogues': 'catalogs'
  'orthologue': 'ortholog'
  'orthologues': 'orthologs'
  'homologue': 'homolog'
  'homologues': 'homologs'
  'analogue': 'analog'
  'analogues': 'analogs'
  # doubled-l before suffix
  'labelled': 'labeled'
  'labelling': 'labeling'
  'modelling': 'modeling'
  'signalling': 'signaling'
  'travelled': 'traveled'
  'cancelled': 'canceled'
  # miscellaneous
  'licence': 'license'
  'defence': 'defense'
  'grey': 'gray'
  'programme': 'program'
  'artefact': 'artifact'
  'artefacts': 'artifacts'
