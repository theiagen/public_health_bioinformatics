# Vale configuration for PHB documentation
# https://vale.sh/docs/topics/config/
#
# Run locally with:   vale docs/
# Vale is also run automatically in CI (.github/workflows/docs-lint.yml)
# and via pre-commit (.pre-commit-config.yaml).

StylesPath = docs/styles

# Report everything down to suggestions. Tighten to "warning" or "error"
# in CI once the backlog is cleared.
MinAlertLevel = suggestions

# Custom accepted-spelling vocabulary (tool names, species, file formats, jargon)
# lives in styles/config/vocabularies/PHB/{accept,reject}.txt
Vocab = PHB

[*.md]
# "Vale" is the built-in style bundled with the binary (Spelling, Repetition, ...).
# "PHB" is our custom style in styles/PHB/.
BasedOnStyles = Vale, PHB

# Built-in spell checker. Disabled by default: bioinformatics docs contain a very
# large vocabulary of tool names, species, names, and jargon, so spell-check produces
# many false positives until the accepted-spelling list is exhaustive. The
# vocabulary in styles/config/vocabularies/PHB/ is already seeded — flip this to
# YES (and keep expanding accept.txt) to turn on full spell-checking.
Vale.Spelling = YES
# Catches doubled words ("the the") — high precision, safe to keep on.
Vale.Repetition = YES
# These built-ins are noisy for technical docs; disable them.
Vale.Terms = NO
Vale.Avoid = NO

# --- Protected syntax: mask before linting so Vale never touches it ---
# 1. Jinja/macro calls:            {{ render_tsv_table(...) }}  and  {% raw %}
# 2. HTML comments incl. the       <!-- if: snippy -->  conditional directives
# 3. Zensical block markers:       /// caption | #id   and   /// html | div[...]
# Fenced/inline code is ignored by Vale's Markdown scoping automatically.
TokenIgnores = (\{\{[\s\S]*?\}\}), (\{%[\s\S]*?%\}), (<!--[\s\S]*?-->), ((?m)^ *///[^\n]*)


# --- IGNORE ALL REFERENCES SECTIONS DUE TO THE ABUNDANCE OF NAMES AND COMPLICATED SYNTAX
BlockIgnores = (?s) *(References.+), (?s)(Centre for Genomic Epidemiology)
